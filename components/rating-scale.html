<section class="ctm-rating-scale"

         id="ratingScale">


    <!-- ==============================================================
         HEADER
         ============================================================== -->


    <div class="rating-header">


        <h3 class="rating-title">

            Rate Yourself™

        </h3>


        <p class="rating-subtitle">

            Choose the score that best reflects your present reality.

        </p>


    </div>





    <!-- ==============================================================
         SCORE ZONES
         ============================================================== -->


    <div class="rating-zones">



        <div class="rating-zone beginning">


            <span class="zone-icon">

                🌱

            </span>


            <span class="zone-label">

                Beginning Journey

            </span>


            <span class="zone-range">

                1 — 3

            </span>


        </div>





        <div class="rating-zone developing">


            <span class="zone-icon">

                🌿

            </span>


            <span class="zone-label">

                Building Momentum

            </span>


            <span class="zone-range">

                4 — 7

            </span>


        </div>





        <div class="rating-zone flourishing">


            <span class="zone-icon">

                ✨

            </span>


            <span class="zone-label">

                Living Your Potential

            </span>


            <span class="zone-range">

                8 — 10

            </span>


        </div>



    </div>





    <!-- ==============================================================
         SCORE BUTTONS
         ============================================================== -->


    <div class="rating-buttons"

         role="radiogroup"

         aria-label="Choose your current rating">



        <button

            class="rating-button"

            data-rating="1"

            role="radio"

            aria-label="Rating 1">

            1

        </button>



        <button

            class="rating-button"

            data-rating="2"

            role="radio"

            aria-label="Rating 2">

            2

        </button>



        <button

            class="rating-button"

            data-rating="3"

            role="radio"

            aria-label="Rating 3">

            3

        </button>



        <button

            class="rating-button"

            data-rating="4"

            role="radio"

            aria-label="Rating 4">

            4

        </button>



        <button

            class="rating-button"

            data-rating="5"

            role="radio"

            aria-label="Rating 5">

            5

        </button>



        <button

            class="rating-button"

            data-rating="6"

            role="radio"

            aria-label="Rating 6">

            6

        </button>



        <button

            class="rating-button"

            data-rating="7"

            role="radio"

            aria-label="Rating 7">

            7

        </button>



        <button

            class="rating-button"

            data-rating="8"

            role="radio"

            aria-label="Rating 8">

            8

        </button>



        <button

            class="rating-button"

            data-rating="9"

            role="radio"

            aria-label="Rating 9">

            9

        </button>



        <button

            class="rating-button rating-final"

            data-rating="10"

            role="radio"

            aria-label="Rating 10">

            10

        </button>



    </div>





    <!-- ==============================================================
         CURRENT SELECTION DISPLAY
         ============================================================== -->


    <div class="rating-selected">


        <span class="selected-label">

            Your Current Rating

        </span>



        <span

            id="currentRatingValue"

            class="selected-value">

            —

        </span>



        <span class="selected-total">

            /10

        </span>



    </div>





    <!-- ==============================================================
         JOURNEY MESSAGE
         ============================================================== -->


    <div class="rating-message">


        Select a score to continue your CTM PATH™ journey.



    </div>



</section>



<!-- ==========================================================================
     END COMPONENT

     rating-scale.html

     Version : 2.0

     ========================================================================== -->
