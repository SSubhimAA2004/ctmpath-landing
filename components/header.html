
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : header.html
   Version     : 2.0

   Purpose:

   Global premium journey header.

   Responsibilities:

   • Display CTM PATH™ branding.
   • Display journey identity.
   • Display journey progress.

   Does NOT:

   • Execute navigation.
   • Store user data.
   • Call backend services.

   ========================================================================== -->


<header class="journey-header">



<div class="header-container">





<!-- ==========================================================================
     BRAND IDENTITY
     ========================================================================== -->


<div class="header-brand">



<img

    src="assets/logo/CTM_Logo_Transparent.svg"

    alt="CTM PATH™ Logo"

    class="ctm-logo"



>




<div class="brand-text">



<div class="brand-name">


    CTM PATH™


</div>



<div class="brand-subtitle">


    Guided Journey™


</div>



</div>



</div>







<!-- ==========================================================================
     JOURNEY TITLE

     ========================================================================== -->


<div class="header-journey-title">



<p class="tamil">


    உங்கள் வாழ்க்கை பயணம்


</p>




<p class="english">


    Your Guided Life Journey


</p>



</div>






<!-- ==========================================================================
     PROGRESS INDICATOR

     Controlled by navigation.js

     ========================================================================== -->


<div class="header-progress">



<div class="progress-label">



<span class="tamil">


    பயணம்


</span>



<span class="english">


    Journey


</span>



</div>




<div class="progress-value">


    01 / 18


</div>




<div class="progress-track">


<div

class="progress-fill"

data-progress-fill>

</div>



</div>



</div>





</div>



</header>

<!-- ==========================================================================
     ACCESSIBILITY LAYER

     ========================================================================== -->


<nav

    class="header-accessibility"

    aria-label="CTM PATH™ Guided Journey Navigation"

>





<div class="sr-only">


    CTM PATH™ Guided Journey™


</div>





<div

    class="journey-status"

    role="status"

    aria-live="polite"

>




<span class="sr-only">


    Current journey progress


</span>



<span data-progress-text>


    Step 01 of 18


</span>



</div>





</nav>






<!-- ==========================================================================
     DECORATIVE BRAND DIVIDER

     ========================================================================== -->


<div class="header-accent-line"></div>
