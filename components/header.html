
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : header.html
   Version     : 3.2

   Purpose:

   Single premium global header.

   Responsibilities:

   • Display CTM PATH™ brand identity.
   • Display journey progress.

   Does NOT:

   • Render page content.
   • Control navigation.
   • Manage application state.

   ========================================================================== -->


<header class="ctm-header">


    <div class="ctm-header-container">



        <!-- ==============================================================
             BRAND IDENTITY
             
             SVG logo removed.

             Reason:
             CTM_Logo_Transparent.svg contains the complete brand lockup:

             • Infinity symbol
             • CTM PATH
             • Guided Journey
             • Every Dream Has A Path

             Rendering it here created duplicate branding.

             Future:
             Replace with compact CTM_Mark.svg if required.

             ============================================================== -->


        <div class="ctm-brand">





            <div class="ctm-brand-text">



                <div class="ctm-brand-name">

                    CTM PATH™

                </div>





                <div class="ctm-brand-subtitle">

                    Guided Journey™

                </div>





                <div class="ctm-brand-tagline">

                    Every Dream Has A Path™

                </div>



            </div>



        </div>







        <!-- ==============================================================
             JOURNEY PROGRESS
             ============================================================== -->


        <div class="ctm-journey-status">





            <div class="ctm-journey-label">


                Journey


            </div>






            <div class="ctm-journey-step">



                <span data-current-step>

                    01

                </span>



                /



                <span data-total-steps>

                    18

                </span>



            </div>





        </div>





    </div>


</header>
