
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : header.html
   Version     : 3.0

   Purpose:

   Global premium brand header.

   Responsibilities:

   • Display CTM PATH™ identity.
   • Display logo.
   • Display journey progress.

   Does NOT:

   • Control navigation.
   • Manage application state.
   • Execute scripts.

   ========================================================================== -->


<header class="ctm-header">



    <div class="ctm-header-container">





        <!-- BRAND AREA -->

        <div class="ctm-brand">



            <img

                src="assets/logo/CTM_Logo_Transparent.svg"

                alt="CTM PATH™ Logo"

                class="ctm-header-logo"

            />





            <div class="ctm-brand-text">



                <div class="ctm-brand-name">

                    CTM PATH™

                </div>




                <div class="ctm-brand-subtitle">

                    Guided Journey™

                </div>




                <div class="ctm-brand-tagline">

                    Every Dream Has A Path™

                </div>



            </div>



        </div>








        <!-- JOURNEY STATUS -->

        <div class="ctm-journey-status">



            <div class="ctm-journey-label">

                Journey

            </div>



            <div

                class="ctm-journey-step"

                data-current-step

            >

                01 / 18

            </div>



        </div>





    </div>



</header>
