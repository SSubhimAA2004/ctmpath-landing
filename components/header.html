
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : header.html
   Version     : 4.0

   Purpose:

   Premium global header component.

   Responsibilities:

   • Display CTM PATH™ identity.
   • Display frozen CTM cosmic mark.
   • Display journey progress indicator.

   Does NOT:

   • Render page content.
   • Control navigation.
   • Manage application state.

   ========================================================================== -->


<header class="ctm-header">


    <div class="ctm-header-container">



        <!-- ==============================================================
             BRAND IDENTITY
             ============================================================== -->


        <div class="ctm-brand">



            <!-- ----------------------------------------------------------
                 CTM MASTER SYMBOL

                 Frozen Asset:

                 assets/logo/CTM_Mark.svg

                 ---------------------------------------------------------- -->


            <img

                src="assets/logo/CTM_Mark.svg"

                alt="CTM PATH™ Cosmic Journey"

                class="ctm-header-logo"

            />





            <!-- ----------------------------------------------------------
                 BRAND TEXT
                 ---------------------------------------------------------- -->


            <div class="ctm-brand-text">



                <div class="ctm-brand-name">

                    CTM PATH™

                </div>




                <div class="ctm-brand-subtitle">

                    Guided Journey™

                </div>




                <div class="ctm-brand-tagline">

                    Every Dream Has A Path™

                </div>



            </div>



        </div>







        <!-- ==============================================================
             JOURNEY STATUS
             ============================================================== -->


        <div class="ctm-journey-status">



            <div class="ctm-journey-label">

                Journey

            </div>





            <div class="ctm-journey-step">



                <span data-current-step>

                    01

                </span>



                <span class="ctm-step-divider">

                    /

                </span>



                <span data-total-steps>

                    18

                </span>



            </div>



        </div>





    </div>


</header>
