
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : header.html
   Version     : 1.1

   Purpose:

   Global premium branded header component.

   Responsibilities:

   • Display CTM PATH™ logo.
   • Display journey identity.
   • Display bilingual journey title.
   • Display progress indicator.

   Does NOT:

   • Execute navigation.
   • Store user data.
   • Call backend APIs.

   Loaded into:

   #app-header

   ========================================================================== -->


<header class="journey-header">



<div class="header-container">





<!-- ==========================================================================
     BRAND AREA

     Asset:

     assets/logo/CTM_Logo_Transparent.svg

     ========================================================================== -->


<div class="header-brand">



<img

    src="assets/logo/CTM_Logo_Transparent.svg"

    alt="CTM PATH™ Logo"

    class="ctm-logo"



>



<div class="brand-text">



<div class="brand-name">


    CTM PATH™


</div>



<div class="brand-subtitle">


    Guided Journey™


</div>



</div>



</div>






<!-- ==========================================================================
     JOURNEY IDENTITY

     ========================================================================== -->


<div class="header-title">



<p class="tamil">


    உங்கள் வாழ்க்கை பயணம்


</p>



<p class="english">


    Your Guided Life Journey


</p>



</div>






<!-- ==========================================================================
     JOURNEY PROGRESS

     Controlled by:

     js/navigation.js

     ========================================================================== -->


<div class="header-progress">



<div class="progress-label">



<span class="tamil">


    பயணம்


</span>




<span class="english">


    Journey


</span>



</div>





<div class="progress-track">



<div

class="progress-fill"

data-progress-fill>


</div>



</div>





<div

class="progress-counter"

data-progress-counter>


1 / 18


</div>



</div>





</div>



</header>

<!-- ==========================================================================
     ACCESSIBILITY ENHANCEMENTS

     ========================================================================== -->


<nav

    class="journey-header-nav"

    aria-label="CTM PATH™ Guided Journey Navigation"



>





<!-- ==========================================================================
     BRAND ACCESSIBILITY LABEL

     ========================================================================== -->


<div

    class="sr-only"


>

    CTM PATH Guided Journey


</div>





<!-- ==========================================================================
     PROGRESS INFORMATION

     ========================================================================== -->


<div

    class="journey-status"

    role="status"

    aria-live="polite"



>



<span class="sr-only">

    Current journey progress:

</span>



<span

    data-progress-text

>

    Step 1 of 18


</span>



</div>





</nav>





<!-- ==========================================================================
     HEADER DECORATIVE ACCENT

     Premium visual separator.

     ========================================================================== -->


<div

    class="header-accent-line"


></div>
