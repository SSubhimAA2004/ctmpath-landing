<section class="kaalachakra-dashboard">



    <!-- ==========================================================
         HEADER
         ========================================================== -->


    <header class="kd-header">


        <div class="kd-brand">


            <span class="kd-eyebrow">

                CTM PATH™

            </span>



            <h2 class="kd-title">

                Life Alignment™ 360

            </h2>



            <p class="kd-subtitle">

                From Survival To Living™

            </p>


        </div>



        <div class="kd-overall-score">


            <span class="kd-score-label">

                Overall Score

            </span>



            <div class="kd-score-display">


                <span
                    class="kd-score-value"
                    data-overall-score>

                    0

                </span>



                <span
                    class="kd-score-total">

                    /360

                </span>


            </div>


        </div>


    </header>





    <!-- ==========================================================
         KALA CHAKRA™
         ========================================================== -->


    <section class="kd-wheel-section">


        <div
            id="kaalachakra-container"

            class="kd-wheel-container">

            <!--
                Rendered by

                js/components/
                kaalachakra-dashboard.js
            -->

        </div>


    </section>





    <!-- ==========================================================
         SUMMARY GRID
         ========================================================== -->


    <section class="kd-summary-grid">



        <!-- ======================================================
             CURRENT PILLAR
             ====================================================== -->


        <article class="kd-card">


            <span class="kd-card-title">

                Current Pillar™

            </span>



            <h3
                class="kd-pillar-name"

                data-current-pillar>

                PURPOSE™

            </h3>



            <div class="kd-pillar-score">


                <span
                    data-pillar-score>

                    0

                </span>


                <span>

                    /30

                </span>


            </div>


        </article>





        <!-- ======================================================
             CURRENT STATUS
             ====================================================== -->


        <article class="kd-card">


            <span class="kd-card-title">

                Current Status™

            </span>



            <div
                class="kd-status kd-status-learner"

                data-status>

                LEARNER™

            </div>



            <p
                class="kd-status-message"

                data-status-message>

                Your journey has just begun.

            </p>


        </article>





        <!-- ======================================================
             PROGRESS
             ====================================================== -->


        <article class="kd-card">


            <span class="kd-card-title">

                Assessment Progress™

            </span>



            <div class="kd-progress">


                <div class="kd-progress-track">


                    <div
                        class="kd-progress-fill"

                        data-progress-fill>

                    </div>


                </div>



                <div class="kd-progress-meta">


                    <span>

                        Progress

                    </span>



                    <span
                        data-progress>

                        1 / 12

                    </span>


                </div>


            </div>


        </article>


    </section>





    <!-- ==========================================================
         DAILY INSIGHT
         ========================================================== -->


    <section class="kd-insight-card">


        <span class="kd-card-title">

            Today's Insight™

        </span>



        <p
            class="kd-insight"

            data-insight>

            Every meaningful transformation
            begins with one honest answer.

        </p>


    </section>



</section>
