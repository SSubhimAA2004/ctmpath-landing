<section
    class="status-card-component">



    <!-- ==========================================================
         HEADER
         ========================================================== -->


    <header
        class="status-header">


        <span
            class="status-label">

            CURRENT STATUS™

        </span>



        <h2
            class="status-name"
            data-status-name>

            LEARNER™

        </h2>



        <p
            class="status-subtitle"
            data-status-subtitle>

            Beginning Your Journey

        </p>


    </header>





    <!-- ==========================================================
         SCORE
         ========================================================== -->


    <section
        class="status-score-panel">


        <span
            class="score-caption">

            Current Pillar Score

        </span>



        <div
            class="score-display">


            <span
                class="score-value"
                data-pillar-score>

                0

            </span>



            <span
                class="score-total">

                /30

            </span>


        </div>


    </section>





    <!-- ==========================================================
         STATUS BADGE
         ========================================================== -->


    <section
        class="status-badge-panel">


        <div
            class="status-badge"

            data-status-badge>


            <span
                class="status-indicator">

                ●

            </span>



            <span
                class="status-text">

                Emerging

            </span>


        </div>


    </section>





    <!-- ==========================================================
         STATUS MESSAGE
         ========================================================== -->


    <section
        class="status-message-panel">


        <p
            class="status-message"

            data-status-message>

            Complete all three questions to
            discover your present level of
            Purpose™ Alignment.

        </p>


    </section>





    <!-- ==========================================================
         JOURNEY REMINDER
         ========================================================== -->


    <section
        class="status-journey-panel">


        <div
            class="journey-reminder">


            <span
                class="journey-title">

                Remember

            </span>



            <p
                class="journey-description">

                There are no right or wrong
                answers.

                Honest self-reflection creates
                meaningful transformation.

            </p>


        </div>


    </section>



</section>
