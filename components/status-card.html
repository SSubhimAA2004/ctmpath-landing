<template id="status-card-template">


    <section class="status-card-component">



        <!-- ==========================================================
             HEADER
             ========================================================== -->


        <header class="status-header">


            <span class="status-label">

                CURRENT STATUS™

            </span>



            <h2
                class="status-name"
                data-status-name>

                LEARNER™

            </h2>



            <p
                class="status-subtitle"
                data-status-subtitle>

                Your journey has just begun.

            </p>



        </header>





        <!-- ==========================================================
             SCORE
             ========================================================== -->


        <div class="status-score">



            <span class="score-caption">

                Pillar Score

            </span>



            <div class="score-value">


                <span data-pillar-score>

                    0

                </span>


                <span>

                    /30

                </span>


            </div>



        </div>





        <!-- ==========================================================
             BADGE
             ========================================================== -->


        <div
            class="status-badge"

            data-status-badge>



            <span
                class="status-indicator">

                ●

            </span>



            <span
                class="status-text">

                Emerging

            </span>



        </div>





        <!-- ==========================================================
             ENCOURAGEMENT
             ========================================================== -->


        <div
            class="status-message"

            data-status-message>



            Complete all three questions
            to discover your current
            Purpose™ alignment.



        </div>



    </section>


</template>
