<!-- ==========================================================================
     STATUS CARD DYNAMIC HOOKS

     Controlled by:

     js/assessmentUI.js
     js/dashboard.js


     ========================================================================== -->


<script>


(function(){



    const card =

        document.querySelector(

            "#statusCard"

        );





    if(!card){

        return;

    }





    /*
       READY SIGNAL

       Allows UI layer to confirm
       premium component availability.

    */


    card.classList.add(

        "status-card-ready"

    );







    /*
       OBSERVE THEME UPDATES

       Uses CSS variables only.

       No business logic.

    */


    function syncTheme(){



        const primary =

            getComputedStyle(

                document.documentElement

            )

            .getPropertyValue(

                "--pillar-primary"

            );





        if(primary){



            card.style.setProperty(

                "--status-accent",

                primary.trim()

            );



        }



    }







    syncTheme();







    /*
       LISTEN FOR JOURNEY UPDATES

       Future compatible.

    */


    document.addEventListener(

        "ctmStatusUpdated",

        function(event){



            if(!event.detail){

                return;

            }





            card.classList.remove(

                "status-changing"

            );







            void card.offsetWidth;







            card.classList.add(

                "status-changing"

            );





        }

    );







})();



</script>
