   ✓ Show current stage
   ✓ Provide consistent progress experience

   --------------------------------------------------------------------------

   ✗ Control navigation
   ✗ Contain assessment logic

<section class="progress-system"
         aria-label="Journey Progress">


    <!-- ==============================================================
         PROGRESS HEADER
         ============================================================== -->


    <div class="progress-header">


        <span class="progress-label">

            Your Journey

        </span>


        <span class="progress-count"
              data-progress-count>

            01 / 18

        </span>


    </div>



    <!-- ==============================================================
         PROGRESS TRACK
         ============================================================== -->


    <div class="progress-track"
         role="progressbar"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-valuenow="0">


        <div class="progress-fill"
             data-progress-fill>

        </div>


    </div>



    <!-- ==============================================================
         JOURNEY MOMENT
         ============================================================== -->


    <div class="progress-moment"
         data-progress-title>


        Beginning Your Journey™

    </div>



</section>
