        CTM PATH™ | Registration

    <link
        rel="stylesheet"

<body>

<div class="app">

<!-- ==========================================================
     Header
     ========================================================== -->

<header class="app-header">

    <div class="container">

        <img

            src="../assets/logo/ctm-path-logo.svg"

            alt="CTM PATH Logo"

            class="logo">

    </div>

</header>

<!-- ==========================================================
     Main
     ========================================================== -->

<main class="app-main">

<div class="container">

<div class="content">

<section class="glass-card registration-card">

<!-- ==========================================================
     Progress
     ========================================================== -->

<div class="progress">

    <div class="progress-label">

        <span>

            Step 1 of 7

        </span>

        <span>

            Registration

        </span>

    </div>

    <div class="progress-track">

        <div

            id="progressBar"

            class="progress-fill"

            style="width:14%;">

        </div>

    </div>

</div>

<!-- ==========================================================
     Heading
     ========================================================== -->

<h1 class="page-title">

    Before We Begin…

</h1>

<p class="page-subtitle">

    Kindly share a few details so we can personalise your Guided
    Journey and generate your Kala Chakra™, Diagnosis™ and
    Prescription™.

</p>

<!-- ==========================================================
     Registration Form
     ========================================================== -->

<form

    id="registrationForm"

    novalidate>

<div class="form-group">

<label
    class="form-label"
    for="fullName">

    Full Name

</label>

<input

    id="fullName"

    name="fullName"

    type="text"

    class="form-control"

    maxlength="100"

    autocomplete="name"

    required>

</div>

<div class="form-group">

<label
    class="form-label"
    for="mobile">

    Mobile Number

</label>

<input

    id="mobile"

    name="mobile"

    type="tel"

    class="form-control"

    maxlength="15"

    autocomplete="tel"

    required>

</div>

<div class="form-group">

<label
    class="form-label"
    for="email">

    Email Address

</label>

<input

    id="email"

    name="email"

    type="email"

    class="form-control"

    maxlength="120"

    autocomplete="email"

    required>

</div>

<!-- ==========================================================
     Continue in Batch 2/n
     ========================================================== -->

    <div class="form-group">

<label
    class="form-label"
    for="district">

    District

</label>

<input

    id="district"

    name="district"

    type="text"

    class="form-control"

    maxlength="80"

    autocomplete="address-level2"

    required>

</div>

<div class="form-group">

<label
    class="form-label"
    for="state">

    State

</label>

<input

    id="state"

    name="state"

    type="text"

    class="form-control"

    maxlength="80"

    autocomplete="address-level1"

    required>

</div>

<div class="form-group">

<label
    class="form-label"
    for="language">

    Preferred Language

</label>

<select

    id="language"

    name="language"

    class="form-control"

    required>

        <option value="">

            Select Language

        </option>

        <option value="ta">

            தமிழ்

        </option>

        <option value="en">

            English

        </option>

</select>

</div>

<div class="form-group">

<label
    class="form-label"
    for="referralSource">

    How did you hear about CTM PATH™?

</label>

<select

    id="referralSource"

    name="referralSource"

    class="form-control">

        <option value="">

            Select One

        </option>

        <option>

            WhatsApp

        </option>

        <option>

            Facebook

        </option>

        <option>

            YouTube

        </option>

        <option>

            Instagram

        </option>

        <option>

            Friend

        </option>

        <option>

            Seminar

        </option>

        <option>

            Website

        </option>

        <option>

            Other

        </option>

</select>

</div>

<!-- ==========================================================
     Privacy Consent
     ========================================================== -->

<div class="privacy-consent">

<label class="checkbox-row">

<input

    id="privacyConsent"

    type="checkbox"

    required>

<span>

I understand that my responses will remain confidential and
will only be used to generate my personalised assessment
results.

</span>

</label>

</div>

<!-- ==========================================================
     Continue in Batch 3/n
     ========================================================== -->

    <!-- ==========================================================
     Navigation
     ========================================================== -->

<div class="navigation">

    <button

        type="button"

        id="backButton"

        class="btn btn-secondary">

        ← Back

    </button>

    <button

        type="submit"

        id="continueButton"

        class="btn btn-primary">

        Continue →

    </button>

</div>

</form>

</section>

</div>

</div>

</main>

     Footer
     ========================================================== -->

<footer class="app-footer">

    <div class="container">

        <p>

            © 2026 CTM PATH™ · Guided Journey™

        </p>

    </div>

</footer>

</div>

</body>

</html>
