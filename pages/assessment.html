
<!DOCTYPE html>
<html lang="ta">

<head>

    <!--
    =====================================================================

        CTM PATH™

        FROM SURVIVAL TO LIVING™

        FILE

        assessment.html

        PURPOSE

        Screens 03–14

        Dynamic Assessment Experience

        RESPONSIBILITIES

        • Render 12 Assessment Pillars
        • Display Dynamic Content
        • Capture Visitor Ratings
        • Calculate Pillar Percentage
        • Auto Save Progress
        • Route to Kala Chakra™

        NOTE

        No assessment content belongs here.

        All content is loaded dynamically from

            assessmentData.js

        All business logic belongs to

            assessment.js

    =====================================================================
    -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        CTM PATH™ | Life Assessment™

    </title>



    <!--==================================================
        Stylesheets
    ==================================================-->

    <link
        rel="stylesheet"
        href="../css/reset.css">

    <link
        rel="stylesheet"
        href="../css/tokens.css">

    <link
        rel="stylesheet"
        href="../css/base.css">

    <link
        rel="stylesheet"
        href="../css/app.css">

    <link
        rel="stylesheet"
        href="../css/assessment.css">

</head>

<body>

<main class="assessment-page">

    <!--==========================================
        Ambient Background
    ===========================================-->

    <div class="assessment-background"></div>

    <!--==========================================
        Main Container
    ===========================================-->

    <section class="assessment-container">

        <article class="assessment-card">

            <!--==========================================
                Premium Brand Header
            ===========================================-->

            <header class="brand-header">

                <div class="brand-logo">

                    <img

                        src="../assets/logo/CTM_Logo_Transparent.svg"

                        alt="CTM PATH™"

                        class="ctm-logo">

                </div>

                <h1 class="brand-name">

                    CTM PATH™

                </h1>

                <p class="brand-tagline">

                    FROM SURVIVAL TO LIVING™

                </p>

            </header>



            <!--==========================================
                Assessment Progress
            ===========================================-->

            <section class="assessment-progress">

                <div class="progress-top">

                    <div
                        class="progress-spoke"
                        id="progressSpoke">

                        SPOKE 1 OF 12

                    </div>

                    <div
                        class="progress-percentage"
                        id="progressPercentage">

                        8%

                    </div>

                </div>

                <div class="progress-track">

                    <div

                        id="progressFill"

                        class="progress-fill">

                    </div>

                </div>

            </section>



            <!--==========================================
                Assessment Content
            ===========================================-->

            <section
                id="assessmentContent"
                class="assessment-content">

                <!--======================================
                    Pillar Number
                =======================================-->

                <div
                    class="pillar-number"
                    id="pillarNumber">

                    SPOKE 01 OF 12

                </div>



                <!--======================================
                    Tamil Title
                =======================================-->

                <h2
                    class="pillar-title-ta"
                    id="pillarTitleTa">

                    நோக்கம்™

                </h2>



                <!--======================================
                    English Title
                =======================================-->

                <h3
                    class="pillar-title-en"
                    id="pillarTitleEn">

                    PURPOSE™

                </h3>



                <div class="section-divider"></div>



                <!--======================================
                    Introduction
                =======================================-->

                <section class="introduction-section">

                    <h4 class="section-title">

                        Introduction

                    </h4>

                    <p
                        class="intro-ta"
                        id="introTa">

                    </p>

                    <p
                        class="intro-en"
                        id="introEn">

                    </p>

                </section>



                <div class="section-divider"></div>

                                <!--======================================
                    Rate Yourself
                =======================================-->

                <section class="rating-section">

                    <h4 class="section-title">

                        Rate Yourself

                    </h4>



                    <!--==================================
                        Question 01
                    ==================================-->

                    <article class="question-card">

                        <div
                            class="question-text"

                            id="question1">

                        </div>


                        <div
                            class="rating-scale"

                            data-question="1"

                            id="ratingQuestion1">


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="1">

                                1

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="2">

                                2

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="3">

                                3

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="4">

                                4

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="5">

                                5

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="6">

                                6

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="7">

                                7

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="8">

                                8

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="9">

                                9

                            </button>


                            <button
                                type="button"
                                class="rating-button"
                                data-question="1"
                                data-value="10">

                                10

                            </button>


                        </div>

                    </article>



                    <!--==================================
                        Question 02
                    ==================================-->

                    <article class="question-card">

                        <div
                            class="question-text"

                            id="question2">

                        </div>


                        <div
                            class="rating-scale"

                            data-question="2"

                            id="ratingQuestion2">


                            <button type="button" class="rating-button" data-question="2" data-value="1">1</button>
                            <button type="button" class="rating-button" data-question="2" data-value="2">2</button>
                            <button type="button" class="rating-button" data-question="2" data-value="3">3</button>
                            <button type="button" class="rating-button" data-question="2" data-value="4">4</button>
                            <button type="button" class="rating-button" data-question="2" data-value="5">5</button>
                            <button type="button" class="rating-button" data-question="2" data-value="6">6</button>
                            <button type="button" class="rating-button" data-question="2" data-value="7">7</button>
                            <button type="button" class="rating-button" data-question="2" data-value="8">8</button>
                            <button type="button" class="rating-button" data-question="2" data-value="9">9</button>
                            <button type="button" class="rating-button" data-question="2" data-value="10">10</button>

                        </div>

                    </article>



                    <!--==================================
                        Question 03
                    ==================================-->

                    <article class="question-card">

                        <div
                            class="question-text"

                            id="question3">

                        </div>


                        <div
                            class="rating-scale"

                            data-question="3"

                            id="ratingQuestion3">


                            <button type="button" class="rating-button" data-question="3" data-value="1">1</button>
                            <button type="button" class="rating-button" data-question="3" data-value="2">2</button>
                            <button type="button" class="rating-button" data-question="3" data-value="3">3</button>
                            <button type="button" class="rating-button" data-question="3" data-value="4">4</button>
                            <button type="button" class="rating-button" data-question="3" data-value="5">5</button>
                            <button type="button" class="rating-button" data-question="3" data-value="6">6</button>
                            <button type="button" class="rating-button" data-question="3" data-value="7">7</button>
                            <button type="button" class="rating-button" data-question="3" data-value="8">8</button>
                            <button type="button" class="rating-button" data-question="3" data-value="9">9</button>
                            <button type="button" class="rating-button" data-question="3" data-value="10">10</button>

                        </div>

                    </article>

                </section>



                <div class="section-divider"></div>



                <!--======================================
                    Pillar Score
                =======================================-->

                <section class="pillar-score-card">

                    <div class="score-label">

                        Current Pillar Score

                    </div>

                    <div
                        class="score-value"

                        id="pillarPercentage">

                        0%

                    </div>

                </section>



                <div class="section-divider"></div>



                <!--======================================
                    Reflection
                =======================================-->

                <section class="reflection-section">

                    <h4 class="section-title">

                        Reflection

                    </h4>

                    <p
                        id="reflectionTa"

                        class="reflection-ta">

                    </p>

                    <p
                        id="reflectionEn"

                        class="reflection-en">

                    </p>

                </section>



                <div class="section-divider"></div>

                                <!--======================================
                    Wisdom
                =======================================-->

                <section class="wisdom-section">

                    <h4 class="section-title">

                        Wisdom

                    </h4>

                    <p
                        id="wisdomTa"
                        class="wisdom-ta">

                    </p>

                    <p
                        id="wisdomEn"
                        class="wisdom-en">

                    </p>

                </section>



                <div class="section-divider"></div>



                <!--======================================
                    Navigation
                =======================================-->

                <section class="assessment-navigation">

                    <!--==============================
                        Previous
                    ==============================-->

                    <button

                        id="previousButton"

                        class="secondary-button"

                        type="button">

                        <span class="button-icon">

                            ←

                        </span>

                        <span class="button-content">

                            <span class="button-ta">

                                முந்தைய பகுதி

                            </span>

                            <span class="button-en">

                                PREVIOUS

                            </span>

                        </span>

                    </button>



                    <!--==============================
                        Next
                    ==============================-->

                    <button

                        id="nextButton"

                        class="primary-button"

                        type="button"

                        disabled>

                        <span class="button-content">

                            <span class="button-ta">

                                அடுத்த பகுதி

                            </span>

                            <span class="button-en">

                                NEXT

                            </span>

                        </span>

                        <span class="button-icon">

                            →

                        </span>

                    </button>

                </section>



                <!--======================================
                    Completion Message
                =======================================-->

                <section

                    id="completionBanner"

                    class="completion-banner"

                    hidden>

                    <div class="completion-icon">

                        ✓

                    </div>

                    <div class="completion-content">

                        <h4>

                            Assessment Complete

                        </h4>

                        <p>

                            All twelve life pillars have been assessed.
                            Your Kala Chakra™ is now ready.

                        </p>

                    </div>

                </section>

            </section>

        </article>

    </section>

</main>

<script
    src="../js/storage.js">
</script>

<script
    src="../js/api.js">
</script>

<script
    src="../js/router.js">
</script>

<script
    src="../js/app.js">
</script>



<!--==================================================

===================================================-->

<script
    src="../js/assessmentData.js">
</script>



<!--==================================================

===================================================-->

<script
    src="../js/assessment.js">
</script>

</body>

</html>
