
<!DOCTYPE html>

<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CTM PATH™ Millionaires™ — Middle Class to Millionaire Lifestyle Scorecard™ — Dimension 03 Assets™"
    >

    <title>
        CTM PATH™ MILLIONAIRES™ — Assets™
    </title>


    <!-- =====================================================================
         PAGE 02 SHARED DIMENSION SYSTEM

         Page 02D follows the same frozen structural architecture as
         Page 02B and Page 02C.

         DO NOT ADD:
         - global responsive foundation
         - global header CSS
         - global footer CSS
         - global header component
         - global footer component
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02-shared.css"
    >


    <!-- =====================================================================
         PAGE 02D — DIMENSION 03 / ASSETS™
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02d.css"
    >

</head>


<body>


    <!-- =========================================================================
         PAGE 02D
         DIMENSION 03 — ASSETS™
         INDICATORS 11–15

         No global header.
         No global footer.

         Page 02D is intentionally self-contained like the frozen Page 02B
         architecture.
    ============================================================================ -->

    <main
        id="page02d"
        class="page02-dimension page02d"
    >


        <div class="page02-dimension-shell">


            <!-- =================================================================
                 JOURNEY PROGRESS
            ================================================================== -->

            <div
                class="dimension-progress"
                aria-label="Scorecard journey progress"
            >

                <div class="dimension-progress-meta">

                    <p class="dimension-progress-label">
                        MILLIONAIRE LIFESTYLE SCORECARD™
                    </p>


                    <p
                        id="dimensionProgressNumber"
                        class="dimension-progress-number"
                    >
                        3 / 5
                    </p>

                </div>


                <div class="dimension-progress-track">

                    <span
                        id="dimensionProgressFill"
                        class="dimension-progress-fill"
                        role="progressbar"
                        aria-label="Dimension progress"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow="60"
                    ></span>

                </div>

            </div>


            <!-- =================================================================
                 DIMENSION HEADER
            ================================================================== -->

            <header class="dimension-header">

                <p class="dimension-eyebrow">
                    DIMENSION 03
                </p>


                <!--
                    Dimension title is populated dynamically by
                    page02-scorecard.js from page02-data.js.
                -->

                <h1
                    id="dimensionTitleTamil"
                    class="dimension-title-tamil"
                ></h1>


                <p
                    id="dimensionTitleEnglish"
                    class="dimension-title-english"
                ></p>


                <p class="dimension-introduction">

                    உங்கள் தற்போதைய வாழ்க்கை நிலைக்கு
                    மிகவும் பொருத்தமான ஒரு தேர்வை
                    ஒவ்வொரு அளவுகோலிலும் தேர்ந்தெடுக்கவும்.

                </p>


                <!-- =============================================================
                     LIVE DIMENSION SCORE

                     This panel is initially located in the header so that
                     page02d.js can relocate it below the progressive scoreboard.

                     Final visual order:

                     SCORECARD
                         ↓
                     PROGRESSIVE SCORE SUMMARY
                         ↓
                     LIVE DIMENSION SCORE
                         ↓
                     NAVIGATION
                ============================================================== -->

                <div
                    id="dimensionScorePanel"
                    class="dimension-score-panel"
                    aria-live="polite"
                >

                    <span class="dimension-score-label">
                        YOUR DIMENSION SCORE
                    </span>


                    <span class="dimension-score-value">

                        <span
                            id="dimensionScoreCurrent"
                            class="dimension-score-current"
                        >
                            0
                        </span>


                        <span
                            id="dimensionScoreTotal"
                            class="dimension-score-total"
                        >
                            / 20
                        </span>

                    </span>

                </div>

            </header>


            <!-- =================================================================
                 SCORECARD

                 IMPORTANT:

                 Indicators 11–15 are NOT hardcoded into this HTML.

                 page02-scorecard.js reads the canonical "assets" dimension
                 from page02-data.js and renders the five indicator cards.

                 This preserves the frozen Page 02 data architecture.
            ================================================================== -->

            <section
                class="dimension-scorecard"
                aria-label="Assets scorecard"
            >

                <div
                    id="scorecardList"
                    class="scorecard-list"
                ></div>

            </section>


            <!-- =================================================================
                 ANSWER PROGRESS
            ================================================================== -->

            <div
                class="dimension-completion"
                aria-live="polite"
            >

                <p>

                    <span data-dimension-answered>
                        0
                    </span>

                    /

                    <span data-dimension-total>
                        5
                    </span>

                    INDICATORS COMPLETED

                </p>

            </div>


            <!-- =================================================================
                 HOW YOUR SCORE WORKS

                 Rendered dynamically by page02-scorecard.js.
            ================================================================== -->

            <aside
                id="scoreGuide"
                class="score-guide"
                aria-label="How your score works"
            ></aside>


            <!-- =================================================================
                 VALIDATION MESSAGE

                 page02-scorecard.js uses this mount when the user attempts
                 to continue before answering all five Assets™ indicators.
            ================================================================== -->

            <div
                id="dimensionMessage"
                class="dimension-message"
                role="alert"
                aria-live="assertive"
                hidden
            ></div>


            <!-- =================================================================
                 NAVIGATION

                 page02d.js controls:

                 1. validation
                 2. completion
                 3. session state
                 4. current dimension transition
                 5. navigation to Page 02E
            ================================================================== -->

            <nav
                class="dimension-navigation"
                aria-label="Scorecard navigation"
            >


                <!-- =============================================================
                     PREVIOUS
                ============================================================== -->

                <button
                    id="previousButton"
                    class="
                        dimension-button
                        dimension-button-secondary
                    "
                    type="button"
                >

                    <span class="dimension-button-primary-text">

                        ← முந்தைய பரிமாணம்

                    </span>


                    <span class="dimension-button-secondary-text">

                        BACK TO DIMENSION 02

                    </span>

                </button>


                <!-- =============================================================
                     NEXT

                     page02d.js will not navigate until all five Assets™
                     indicators have been answered.

                     Completion flow:

                     requireComplete()
                         ↓
                     refresh score
                         ↓
                     complete()
                         ↓
                     setCurrentDimension('lifestyleFreedom')
                         ↓
                     lock navigation
                         ↓
                     page02e.html
                ============================================================== -->

                <button
                    id="nextButton"
                    class="
                        dimension-button
                        dimension-button-primary
                    "
                    type="button"
                >

                    <span class="dimension-button-primary-text">

                        அடுத்த பரிமாணம் →

                    </span>


                    <span class="dimension-button-secondary-text">

                        CONTINUE TO DIMENSION 04

                    </span>

                </button>


            </nav>


        </div>


    </main>


    <!-- =========================================================================
         PAGE 02 JAVASCRIPT

         LOAD ORDER IS CRITICAL

         1. DATA
            Frozen 25 indicators + 100 answer ranges

         2. SESSION
            Shared Page 02 journey state

         3. SCORECARD
            Shared rendering + selection + scoring + validation

         4. PAGE 02D
            Dimension 03 lifecycle + navigation +
            progressive scoreboard presentation

         No component-loader.js
         No global.js
         No api.js
         No global header/footer lifecycle
    ============================================================================ -->

    <script src="../js/page02/page02-data.js"></script>

    <script src="../js/page02/page02-session.js"></script>

    <script src="../js/page02/page02-scorecard.js"></script>

    <script src="../js/page02/page02d.js"></script>


</body>

</html>
