
<!DOCTYPE html>

<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CTM PATH™ Millionaires™ — Middle Class to Millionaire Lifestyle Scorecard™ — Dimension 01 Wealth™"
    >

    <title>
        CTM PATH™ MILLIONAIRES™ — Wealth™
    </title>


    <!-- =====================================================================
         GLOBAL FOUNDATION
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/foundation/tokens.css"
    >

    <link
        rel="stylesheet"
        href="../css/foundation/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/foundation/responsive.css"
    >


    <!-- =====================================================================
         GLOBAL COMPONENTS
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/header.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >


    <!-- =====================================================================
         PAGE 02 SHARED DIMENSION SYSTEM
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02-shared.css"
    >


    <!-- =====================================================================
         PAGE 02B — WEALTH™
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02b.css"
    >

</head>


<body>


<!-- =========================================================================
     GLOBAL HEADER
============================================================================ -->

<div
    id="global-header"
    data-component="header"
></div>


<!-- =========================================================================
     PAGE 02B
     DIMENSION 01 — WEALTH™
============================================================================ -->

<main
    id="page02b"
    class="page02-dimension page02b"
>

    <div class="page02-dimension-shell">


        <!-- =================================================================
             JOURNEY PROGRESS
        ================================================================== -->

        <div
            class="dimension-progress"
            aria-label="Scorecard journey progress"
        >

            <div class="dimension-progress-meta">

                <p class="dimension-progress-label">
                    MILLIONAIRE LIFESTYLE SCORECARD™
                </p>

                <p
                    id="dimensionProgressNumber"
                    class="dimension-progress-number"
                >
                    1 / 5
                </p>

            </div>


            <div class="dimension-progress-track">

                <span
                    id="dimensionProgressFill"
                    class="dimension-progress-fill"
                    role="progressbar"
                    aria-label="Dimension progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="20"
                ></span>

            </div>

        </div>


        <!-- =================================================================
             DIMENSION HERO
        ================================================================== -->

        <header class="dimension-header">

            <p class="dimension-eyebrow">
                DIMENSION 01
            </p>


            <!--
                Populated dynamically from page02-data.js
                by page02-scorecard.js.
            -->

            <h1
                id="dimensionTitleTamil"
                class="dimension-title-tamil"
            ></h1>


            <p
                id="dimensionTitleEnglish"
                class="dimension-title-english"
            ></p>


            <p class="dimension-introduction">
                உங்கள் தற்போதைய வாழ்க்கை நிலைக்கு
                மிகவும் பொருத்தமான ஒரு தேர்வை
                ஒவ்வொரு அளவுகோலிலும் தேர்ந்தெடுக்கவும்.
            </p>

        </header>


        <!-- =================================================================
             SCORECARD
             
             IMPORTANT:
             
             Indicator markup is NOT hardcoded.
             
             page02-scorecard.js reads Dimension 01 from
             page02-data.js and renders Indicators 01–05
             into #scorecardList.
        ================================================================== -->

        <section
            class="dimension-scorecard"
            aria-label="Wealth scorecard"
        >

            <div
                id="scorecardList"
                class="scorecard-list"
            ></div>

        </section>


        <!-- =================================================================
             ANSWER PROGRESS
        ================================================================== -->

        <div
            class="dimension-completion"
            aria-live="polite"
        >

            <p>

                <span data-dimension-answered>
                    0
                </span>

                /

                <span data-dimension-total>
                    5
                </span>

                INDICATORS COMPLETED

            </p>

        </div>


        <!-- =================================================================
             HOW YOUR SCORE WORKS
             
             Rendered by page02-scorecard.js.
        ================================================================== -->

        <aside
            id="scoreGuide"
            class="score-guide"
            aria-label="How your score works"
        ></aside>


        <!-- =================================================================
             VALIDATION MESSAGE
        ================================================================== -->

        <div
            id="dimensionMessage"
            class="dimension-message"
            role="alert"
            aria-live="assertive"
            hidden
        ></div>


        <!-- =================================================================
             JOURNEY SCOREBOARD
             
             NEW:
             
             Six-column progressive score display.
             
             01 — Wealth
             02 — Income & Cash Flow
             03 — Assets
             04 — Lifestyle & Freedom
             05 — Protection & Contribution
             06 — Grand Total
             
             Rendered by page02b.js from Page02Session.
        ================================================================== -->

        <section
            id="journeyScoreboard"
            class="journey-scoreboard"
            aria-label="Your journey score"
        >

            <div class="journey-scoreboard-heading">

                <p class="journey-scoreboard-eyebrow">
                    YOUR JOURNEY SCORE™
                </p>

                <p class="journey-scoreboard-subtitle">
                    ஒவ்வொரு பரிமாணமும் சேர்ந்து உங்கள் முழுமையான வாழ்க்கை மதிப்பெண்ணை உருவாக்குகிறது.
                </p>

            </div>


            <div
                id="journeyScoreGrid"
                class="journey-score-grid"
            >

                <!--
                    Six score cards are rendered dynamically
                    by page02b.js.
                -->

            </div>

        </section>


        <!-- =================================================================
             NAVIGATION
        ================================================================== -->

        <nav
            class="dimension-navigation"
            aria-label="Scorecard navigation"
        >


            <!-- =============================================================
                 PREVIOUS
            ============================================================== -->

            <button
                id="previousButton"
                class="
                    dimension-button
                    dimension-button-secondary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">
                    ← முந்தையது
                </span>

                <span class="dimension-button-secondary-text">
                    BACK TO YOUR DETAILS
                </span>

            </button>


            <!-- =============================================================
                 NEXT
                 
                 page02b.js validates all five indicators before
                 navigating to Dimension 02.
            ============================================================== -->

            <button
                id="nextButton"
                class="
                    dimension-button
                    dimension-button-primary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">
                    அடுத்த பரிமாணம் →
                </span>

                <span class="dimension-button-secondary-text">
                    CONTINUE TO DIMENSION 02
                </span>

            </button>

        </nav>


    </div>

</main>


<!-- =========================================================================
     GLOBAL FOOTER
============================================================================ -->

<div
    id="global-footer"
    data-component="footer"
></div>


<!-- =========================================================================
     GLOBAL JAVASCRIPT
============================================================================ -->

<script src="../js/component-loader.js"></script>

<script src="../js/global.js"></script>

<script src="../js/api.js"></script>


<!-- =========================================================================
     PAGE 02 JAVASCRIPT

     LOAD ORDER IS IMPORTANT.

     1. DATA
        Frozen 25 indicators + 100 range definitions

     2. SESSION
        Shared journey state + answer persistence + scoring

     3. SCORECARD
        Shared renderer + scoring + validation

     4. PAGE 02B
        Dimension 01 navigation controller
        + Journey Scoreboard
============================================================================ -->

<script src="../js/page02/page02-data.js"></script>

<script src="../js/page02/page02-session.js"></script>

<script src="../js/page02/page02-scorecard.js"></script>

<script src="../js/page02/page02b.js"></script>


</body>

</html>
