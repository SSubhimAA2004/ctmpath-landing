
<!DOCTYPE html>

    >

        name="description"
        content="CTM PATH™ Millionaires™ — Middle Class to Millionaire Lifestyle Scorecard™ — Dimension 01 Wealth™"
    >

        CTM PATH™ MILLIONAIRES™ — Wealth™
    </title>

    <link

    <link

    <!-- =====================================================================
         PAGE 02B VISUAL OVERRIDES
         
         Purpose:
         Presentation only.
         
         No scoring logic.
         No navigation logic.
         No content/data replacement.
         
         The existing Page 02 shared system remains the functional source
         of truth. These rules create a stronger visual hierarchy around it.
    ====================================================================== -->

    <style>

        /* ================================================================
           ROOT VISUAL LANGUAGE
        ================================================================ */

        .page02b {

            --wealth-teal:
                #20d3c5;

            --wealth-teal-soft:
                rgba(32, 211, 197, 0.16);

            --wealth-teal-line:
                rgba(32, 211, 197, 0.32);

            --wealth-gold:
                #d8ad58;

            --wealth-ivory:
                #f4f1e8;

            --wealth-muted:
                rgba(244, 241, 232, 0.56);

            --wealth-border:
                rgba(255, 255, 255, 0.08);

            --wealth-surface:
                rgba(255, 255, 255, 0.025);

            --wealth-surface-strong:
                rgba(255, 255, 255, 0.045);

            position:
                relative;

            isolation:
                isolate;

            overflow:
                hidden;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(25, 117, 157, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 10% 35%,
                    rgba(32, 211, 197, 0.045),
                    transparent 26%
                ),

                linear-gradient(
                    180deg,
                    #061b35 0%,
                    #05172d 46%,
                    #061a32 100%
                );

        }


        /* ================================================================
           ATMOSPHERIC LIGHT
        ================================================================ */

        .page02b::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                50%;

            width:
                760px;

            height:
                760px;

            transform:
                translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(32, 211, 197, 0.055) 0%,
                    rgba(32, 211, 197, 0.018) 34%,
                    transparent 70%
                );

            pointer-events:
                none;

            z-index:
                -1;

        }


        /* ================================================================
           HAIRLINE GRID
        ================================================================ */

        .page02b::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            pointer-events:
                none;

            opacity:
                0.16;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.014) 1px,
                    transparent 1px
                );

            background-size:
                72px 72px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    transparent 78%
                );

            z-index:
                -1;

        }


        /* ================================================================
           MASTER SHELL
        ================================================================ */

        .page02b .page02-dimension-shell {

            width:
                min(1180px, calc(100% - 48px));

            margin:
                0 auto;

            padding:
                42px 0 86px;

        }


        /* ================================================================
           JOURNEY PROGRESS
        ================================================================ */

        .page02b .dimension-progress {

            position:
                relative;

            margin:
                0 0 58px;

            padding:
                0;

        }


        .page02b .dimension-progress-meta {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                13px;

        }


        .page02b .dimension-progress-label {

            margin:
                0;

            color:
                rgba(244, 241, 232, 0.48);

            font-size:
                0.66rem;

            font-weight:
                700;

            letter-spacing:
                0.20em;

            line-height:
                1.4;

        }


        .page02b .dimension-progress-number {

            margin:
                0;

            color:
                var(--wealth-gold);

            font-size:
                0.72rem;

            font-weight:
                700;

            letter-spacing:
                0.16em;

        }


        .page02b .dimension-progress-track {

            position:
                relative;

            width:
                100%;

            height:
                2px;

            overflow:
                hidden;

            background:
                rgba(255,255,255,0.08);

        }


        .page02b .dimension-progress-track::before {

            content:
                "";

            position:
                absolute;

            inset:
                -4px 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(32,211,197,0.08),
                    transparent
                );

        }


        .page02b .dimension-progress-fill {

            position:
                relative;

            display:
                block;

            height:
                100%;

            background:
                linear-gradient(
                    90deg,
                    #159d98,
                    var(--wealth-teal)
                );

            box-shadow:
                0 0 18px
                rgba(32,211,197,0.42);

            transition:
                width 0.45s ease;

        }


        /* ================================================================
           HERO / DIMENSION HEADER
        ================================================================ */

        .page02b .dimension-header {

            position:
                relative;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            text-align:
                center;

            margin:
                0 auto 56px;

            max-width:
                920px;

        }


        /* ================================================================
           DIMENSION NUMBER
        ================================================================ */

        .page02b .dimension-eyebrow {

            position:
                relative;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                0 0 22px;

            min-width:
                112px;

            height:
                32px;

            padding:
                0 18px;

            border:
                1px solid
                rgba(216,173,88,0.32);

            border-radius:
                999px;

            color:
                var(--wealth-gold);

            background:
                rgba(216,173,88,0.045);

            font-size:
                0.63rem;

            font-weight:
                800;

            letter-spacing:
                0.24em;

            line-height:
                1;

        }


        .page02b .dimension-eyebrow::before {

            content:
                "";

            width:
                4px;

            height:
                4px;

            margin-right:
                9px;

            border-radius:
                50%;

            background:
                var(--wealth-gold);

            box-shadow:
                0 0 9px
                rgba(216,173,88,0.6);

        }


        /* ================================================================
           TITLE
        ================================================================ */

        .page02b #dimensionTitleTamil {

            margin:
                0;

            max-width:
                900px;

            color:
                var(--wealth-ivory);

            font-size:
                clamp(2rem, 4vw, 3.45rem);

            font-weight:
                700;

            line-height:
                1.22;

            letter-spacing:
                -0.018em;

            text-wrap:
                balance;

            text-shadow:
                0 2px 24px
                rgba(0,0,0,0.25);

        }


        .page02b #dimensionTitleEnglish {

            margin:
                10px 0 0;

            color:
                var(--wealth-teal);

            font-size:
                clamp(0.72rem, 1vw, 0.9rem);

            font-weight:
                800;

            letter-spacing:
                0.28em;

            text-transform:
                uppercase;

        }


        .page02b .dimension-introduction {

            max-width:
                650px;

            margin:
                24px auto 0;

            color:
                rgba(244,241,232,0.60);

            font-size:
                0.92rem;

            line-height:
                1.9;

        }


        /* ================================================================
           LIVE SCORE — HERO MEDALLION
        ================================================================ */

        .page02b .dimension-score-panel {

            position:
                relative;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            width:
                158px;

            height:
                158px;

            margin:
                34px auto 0;

            border:
                1px solid
                rgba(32,211,197,0.26);

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 50% 42%,
                    rgba(32,211,197,0.14),
                    rgba(32,211,197,0.025) 56%,
                    transparent 72%
                ),

                rgba(4,20,39,0.72);

            box-shadow:

                0 0 0 8px
                rgba(32,211,197,0.025),

                0 0 0 1px
                rgba(255,255,255,0.025),

                0 20px 55px
                rgba(0,0,0,0.28);

        }


        .page02b .dimension-score-panel::before {

            content:
                "";

            position:
                absolute;

            inset:
                -10px;

            border:
                1px solid
                rgba(32,211,197,0.08);

            border-radius:
                50%;

        }


        .page02b .dimension-score-label {

            margin:
                0 0 5px;

            color:
                rgba(244,241,232,0.40);

            font-size:
                0.53rem;

            font-weight:
                800;

            letter-spacing:
                0.16em;

            text-align:
                center;

        }


        .page02b .dimension-score-value {

            display:
                flex;

            align-items:
                baseline;

            justify-content:
                center;

            line-height:
                1;

        }


        .page02b .dimension-score-current {

            color:
                var(--wealth-ivory);

            font-size:
                2.8rem;

            font-weight:
                800;

            letter-spacing:
                -0.04em;

        }


        .page02b .dimension-score-total {

            margin-left:
                3px;

            color:
                rgba(244,241,232,0.34);

            font-size:
                0.9rem;

            font-weight:
                600;

        }


        /* ================================================================
           SCORECARD
        ================================================================ */

        .page02b .dimension-scorecard {

            position:
                relative;

            width:
                100%;

            margin:
                0;

            padding:
                0;

        }


        .page02b .scorecard-list {

            display:
                grid;

            grid-template-columns:
                repeat(1, minmax(0, 1fr));

            gap:
                18px;

        }


        /* ================================================================
           GENERATED INDICATOR CARDS
           
           JS injects these into #scorecardList.
           We enhance their presentation without touching their markup.
        ================================================================ */

        .page02b .scorecard-card {

            position:
                relative;

            overflow:
                hidden;

            border:
                1px solid
                var(--wealth-border);

            border-radius:
                18px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                );

            box-shadow:
                0 16px 42px
                rgba(0,0,0,0.12);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .page02b .scorecard-card:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(32,211,197,0.20);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.022)
                );

            box-shadow:
                0 22px 55px
                rgba(0,0,0,0.18);

        }


        .page02b .scorecard-card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                3px;

            height:
                100%;

            background:
                linear-gradient(
                    180deg,
                    var(--wealth-teal),
                    rgba(32,211,197,0.08)
                );

            box-shadow:
                0 0 18px
                rgba(32,211,197,0.18);

        }


        /* ================================================================
           COMPLETION
        ================================================================ */

        .page02b .dimension-completion {

            margin:
                24px auto 0;

            padding:
                13px 20px;

            border:
                1px solid
                rgba(255,255,255,0.055);

            border-radius:
                999px;

            background:
                rgba(255,255,255,0.018);

            text-align:
                center;

            width:
                fit-content;

        }


        .page02b .dimension-completion p {

            margin:
                0;

            color:
                rgba(244,241,232,0.46);

            font-size:
                0.64rem;

            font-weight:
                700;

            letter-spacing:
                0.12em;

        }


        .page02b .dimension-completion [data-dimension-answered] {

            color:
                var(--wealth-teal);

            font-size:
                0.75rem;

        }


        /* ================================================================
           SCORE GUIDE
        ================================================================ */

        .page02b .score-guide {

            margin:
                48px 0 0;

            padding:
                26px 28px;

            border:
                1px solid
                rgba(255,255,255,0.055);

            border-radius:
                18px;

            background:
                rgba(255,255,255,0.018);

        }


        /* ================================================================
           VALIDATION MESSAGE
        ================================================================ */

        .page02b .dimension-message {

            max-width:
                960px;

            margin:
                20px auto 0;

            padding:
                14px 18px;

            border-radius:
                12px;

            text-align:
                center;

        }


        /* ================================================================
           NAVIGATION
        ================================================================ */

        .page02b .dimension-navigation {

            display:
                grid;

            grid-template-columns:
                minmax(0, 0.82fr)
                minmax(0, 1.18fr);

            gap:
                16px;

            margin:
                42px 0 0;

            padding:
                0;

        }


        .page02b .dimension-button {

            min-height:
                72px;

            border-radius:
                14px;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;

        }


        .page02b .dimension-button:hover {

            transform:
                translateY(-2px);

        }


        .page02b .dimension-button-primary {

            box-shadow:
                0 12px 30px
                rgba(32,211,197,0.12);

        }


        /* ================================================================
           RESPONSIVE
        ================================================================ */

        @media (max-width: 900px) {

            .page02b .page02-dimension-shell {

                width:
                    min(100% - 34px, 760px);

                padding-top:
                    32px;

            }

            .page02b .dimension-progress {

                margin-bottom:
                    46px;

            }

            .page02b .dimension-header {

                margin-bottom:
                    44px;

            }

        }


        @media (max-width: 768px) {

            .page02b .page02-dimension-shell {

                width:
                    min(100% - 26px, 620px);

                padding:
                    26px 0 64px;

            }

            .page02b .dimension-progress {

                margin-bottom:
                    38px;

            }

            .page02b .dimension-progress-label {

                font-size:
                    0.57rem;

                letter-spacing:
                    0.14em;

            }

            .page02b .dimension-progress-number {

                font-size:
                    0.62rem;

            }

            .page02b .dimension-eyebrow {

                margin-bottom:
                    17px;

            }

            .page02b .dimension-introduction {

                font-size:
                    0.84rem;

                line-height:
                    1.8;

            }

            .page02b .dimension-score-panel {

                width:
                    136px;

                height:
                    136px;

                margin-top:
                    28px;

            }

            .page02b .dimension-score-current {

                font-size:
                    2.4rem;

            }

            .page02b .score-guide {

                margin-top:
                    34px;

                padding:
                    21px;

            }

            .page02b .dimension-navigation {

                grid-template-columns:
                    1fr;

                gap:
                    11px;

            }

            .page02b .dimension-button {

                min-height:
                    68px;

            }

        }


        @media (max-width: 420px) {

            .page02b .page02-dimension-shell {

                width:
                    calc(100% - 20px);

                padding-bottom:
                    48px;

            }

            .page02b .dimension-progress-meta {

                align-items:
                    flex-end;

            }

            .page02b .dimension-progress-label {

                max-width:
                    190px;

                line-height:
                    1.5;

            }

            .page02b .dimension-title-english {

                letter-spacing:
                    0.20em;

            }

            .page02b .dimension-score-panel {

                width:
                    124px;

                height:
                    124px;

            }

            .page02b .dimension-score-current {

                font-size:
                    2.2rem;

            }

            .page02b .dimension-completion {

                width:
                    100%;

                border-radius:
                    12px;

            }

        }


        /* ================================================================
           REDUCED MOTION
        ================================================================ */

        @media (prefers-reduced-motion: reduce) {

            .page02b *,
            .page02b *::before,
            .page02b *::after {

                scroll-behavior:
                    auto !important;

                transition:
                    none !important;

                animation:
                    none !important;

            }

        }


        /* ================================================================
           PRINT
        ================================================================ */

        @media print {

            .page02b {

                background:
                    #ffffff !important;

            }

            .page02b::before,
            .page02b::after {

                display:
                    none;

            }

            .page02b .dimension-navigation,
            .page02b .dimension-progress {

                display:
                    none;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================================
     GLOBAL HEADER
============================================================================ -->

<div
    id="global-header"
    data-component="header"
></div>



<!-- =========================================================================
     PAGE 02B
     DIMENSION 01 — WEALTH™
============================================================================ -->

<main
    id="page02b"
    class="page02-dimension page02b"
>


    <div class="page02-dimension-shell">


        <!-- =================================================================
             JOURNEY PROGRESS
        ================================================================== -->

        <div
            class="dimension-progress"
            aria-label="Scorecard journey progress"
        >

            <div class="dimension-progress-meta">

                <p class="dimension-progress-label">

                    MILLIONAIRE LIFESTYLE SCORECARD™

                </p>


                <p
                    id="dimensionProgressNumber"
                    class="dimension-progress-number"
                >

                    1 / 5

                </p>

            </div>


            <div class="dimension-progress-track">

                <span
                    id="dimensionProgressFill"
                    class="dimension-progress-fill"
                    role="progressbar"
                    aria-label="Dimension progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="20"
                ></span>

            </div>

        </div>



        <!-- =================================================================
             DIMENSION HERO
        ================================================================== -->

        <header class="dimension-header">


            <p class="dimension-eyebrow">

                DIMENSION 01

            </p>


            <!--
                Populated dynamically from page02-data.js
                by page02-scorecard.js.
            -->

            <h1
                id="dimensionTitleTamil"
                class="dimension-title-tamil"
            ></h1>


            <p
                id="dimensionTitleEnglish"
                class="dimension-title-english"
            ></p>


            <p class="dimension-introduction">

                உங்கள் தற்போதைய வாழ்க்கை நிலைக்கு
                மிகவும் பொருத்தமான ஒரு தேர்வை
                ஒவ்வொரு அளவுகோலிலும் தேர்ந்தெடுக்கவும்.

            </p>


            <!-- =============================================================
                 LIVE DIMENSION SCORE
            ============================================================== -->

            <div
                class="dimension-score-panel"
                aria-live="polite"
            >

                <span class="dimension-score-label">

                    YOUR DIMENSION SCORE

                </span>


                <span class="dimension-score-value">

                    <span
                        id="dimensionScoreCurrent"
                        class="dimension-score-current"
                    >

                        0

                    </span>


                    <span
                        id="dimensionScoreTotal"
                        class="dimension-score-total"
                    >

                        / 20

                    </span>

                </span>

            </div>

        </header>



        <!-- =================================================================
             SCORECARD

             IMPORTANT:

             Indicator markup is NOT hardcoded.

             page02-scorecard.js reads Dimension 01 from page02-data.js
             and renders Indicators 01–05 into #scorecardList.
        ================================================================== -->

        <section
            class="dimension-scorecard"
            aria-label="Wealth scorecard"
        >

            <div
                id="scorecardList"
                class="scorecard-list"
            ></div>

        </section>



        <!-- =================================================================
             ANSWER PROGRESS
        ================================================================== -->

        <div
            class="dimension-completion"
            aria-live="polite"
        >

            <p>

                <span data-dimension-answered>
                    0
                </span>

                /

                <span data-dimension-total>
                    5
                </span>

                INDICATORS COMPLETED

            </p>

        </div>



        <!-- =================================================================
             HOW YOUR SCORE WORKS

             Rendered by page02-scorecard.js.
        ================================================================== -->

        <aside
            id="scoreGuide"
            class="score-guide"
            aria-label="How your score works"
        ></aside>



        <!-- =================================================================
             VALIDATION MESSAGE
        ================================================================== -->

        <div
            id="dimensionMessage"
            class="dimension-message"
            role="alert"
            aria-live="assertive"
            hidden
        ></div>



        <!-- =================================================================
             NAVIGATION
        ================================================================== -->

        <nav
            class="dimension-navigation"
            aria-label="Scorecard navigation"
        >


            <!-- =============================================================
                 PREVIOUS
            ============================================================== -->

            <button
                id="previousButton"
                class="
                    dimension-button
                    dimension-button-secondary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">

                    ← முந்தையது

                </span>


                <span class="dimension-button-secondary-text">

                    BACK TO YOUR DETAILS

                </span>

            </button>



            <!-- =============================================================
                 NEXT

                 page02b.js validates all five indicators before navigating
                 to Dimension 02.
            ============================================================== -->

            <button
                id="nextButton"
                class="
                    dimension-button
                    dimension-button-primary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">

                    அடுத்த பரிமாணம் →

                </span>


                <span class="dimension-button-secondary-text">

                    CONTINUE TO DIMENSION 02

                </span>

            </button>


        </nav>


    </div>

</main>



<!-- =========================================================================
     GLOBAL FOOTER
============================================================================ -->

<div
    id="global-footer"
    data-component="footer"
></div>



<!-- =========================================================================
     GLOBAL JAVASCRIPT
============================================================================ -->

<script src="../js/component-loader.js"></script>

<script src="../js/global.js"></script>

<script src="../js/api.js"></script>



<!-- =========================================================================
