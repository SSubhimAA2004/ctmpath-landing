
<!DOCTYPE html>

<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CTM PATH™ Millionaires™ — Middle Class to Millionaire Lifestyle Scorecard™ — Dimension 01 Wealth™"
    >

    <title>
        CTM PATH™ MILLIONAIRES™ — Wealth™
    </title>


    <!-- =====================================================================
         PAGE 02 SHARED DIMENSION SYSTEM
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02-shared.css"
    >


    <!-- =====================================================================
         PAGE 02B
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02b.css"
    >

</head>


<body>


<!-- =========================================================================
     PAGE 02B
     DIMENSION 01 — WEALTH™
============================================================================ -->

<main
    id="page02b"
    class="page02-dimension page02b"
>


    <div class="page02-dimension-shell">


        <!-- =================================================================
             JOURNEY PROGRESS
        ================================================================== -->

        <div
            class="dimension-progress"
            aria-label="Scorecard journey progress"
        >

            <div class="dimension-progress-meta">

                <p class="dimension-progress-label">
                    MILLIONAIRE LIFESTYLE SCORECARD™
                </p>

                <p
                    id="dimensionProgressNumber"
                    class="dimension-progress-number"
                >
                    1 / 5
                </p>

            </div>


            <div class="dimension-progress-track">

                <span
                    id="dimensionProgressFill"
                    class="dimension-progress-fill"
                    role="progressbar"
                    aria-label="Dimension progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="20"
                ></span>

            </div>

        </div>


        <!-- =================================================================
             DIMENSION HEADER
        ================================================================== -->

        <header class="dimension-header">

            <p class="dimension-eyebrow">
                DIMENSION 01
            </p>


            <!--
                Text is populated from page02-data.js
                by page02-scorecard.js.
            -->

            <h1
                id="dimensionTitleTamil"
                class="dimension-title-tamil"
            ></h1>


            <p
                id="dimensionTitleEnglish"
                class="dimension-title-english"
            ></p>


            <p class="dimension-introduction">

                உங்கள் தற்போதைய வாழ்க்கை நிலைக்கு
                மிகவும் பொருத்தமான ஒரு தேர்வை
                ஒவ்வொரு அளவுகோலிலும் தேர்ந்தெடுக்கவும்.

            </p>


            <!-- =============================================================
                 LIVE DIMENSION SCORE
            ============================================================== -->

            <div
                class="dimension-score-panel"
                aria-live="polite"
            >

                <span class="dimension-score-label">
                    YOUR DIMENSION SCORE
                </span>


                <span class="dimension-score-value">

                    <span
                        id="dimensionScoreCurrent"
                        class="dimension-score-current"
                    >
                        0
                    </span>


                    <span
                        id="dimensionScoreTotal"
                        class="dimension-score-total"
                    >
                        / 20
                    </span>

                </span>

            </div>

        </header>


        <!-- =================================================================
             SCORECARD

             IMPORTANT:

             No indicator markup is hardcoded here.

             page02-scorecard.js reads Dimension 01 from page02-data.js
             and renders Indicators 01–05 here.
        ================================================================== -->

        <section
            class="dimension-scorecard"
            aria-label="Wealth scorecard"
        >

            <div
                id="scorecardList"
                class="scorecard-list"
            ></div>

        </section>


        <!-- =================================================================
             ANSWER PROGRESS
        ================================================================== -->

        <div
            class="dimension-completion"
            aria-live="polite"
        >

            <p>

                <span data-dimension-answered>
                    0
                </span>

                /

                <span data-dimension-total>
                    5
                </span>

                INDICATORS COMPLETED

            </p>

        </div>


        <!-- =================================================================
             HOW YOUR SCORE WORKS

             The complete four-level guide is rendered by
             page02-scorecard.js.

             It follows the same visual architecture as the four options.
        ================================================================== -->

        <aside
            id="scoreGuide"
            class="score-guide"
            aria-label="How your score works"
        ></aside>


        <!-- =================================================================
             VALIDATION MESSAGE
        ================================================================== -->

        <div
            id="dimensionMessage"
            class="dimension-message"
            role="alert"
            aria-live="assertive"
            hidden
        ></div>


        <!-- =================================================================
             NAVIGATION
        ================================================================== -->

        <nav
            class="dimension-navigation"
            aria-label="Scorecard navigation"
        >


            <!-- =============================================================
                 PREVIOUS
            ============================================================== -->

            <button
                id="previousButton"
                class="
                    dimension-button
                    dimension-button-secondary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">
                    ← முந்தையது
                </span>

                <span class="dimension-button-secondary-text">
                    BACK TO YOUR DETAILS
                </span>

            </button>


            <!-- =============================================================
                 NEXT

                 IMPORTANT:

                 page02b.js will NOT navigate until all five indicators
                 have been answered.
            ============================================================== -->

            <button
                id="nextButton"
                class="
                    dimension-button
                    dimension-button-primary
                "
                type="button"
            >

                <span class="dimension-button-primary-text">
                    அடுத்த பரிமாணம் →
                </span>

                <span class="dimension-button-secondary-text">
                    CONTINUE TO DIMENSION 02
                </span>

            </button>

        </nav>


    </div>


</main>


<!-- =========================================================================
     PAGE JAVASCRIPT
============================================================================ -->

<script src="../js/global.js"></script>

<script src="../js/api.js"></script>


<!-- =========================================================================
     PAGE 02 JAVASCRIPT

     LOAD ORDER IS IMPORTANT.

     1. DATA
        Frozen 25 indicators + 100 range definitions

     2. SESSION
        Shared journey state + answer persistence

     3. SCORECARD
        Shared renderer + scoring + validation

     4. PAGE 02B
        Dimension 01 navigation controller
============================================================================ -->

<script src="../js/page02/page02-data.js"></script>

<script src="../js/page02/page02-session.js"></script>

<script src="../js/page02/page02-scorecard.js"></script>

<script src="../js/page02/page02b.js"></script>


</body>

</html>
