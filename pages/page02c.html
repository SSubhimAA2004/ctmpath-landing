
<!DOCTYPE html>

<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CTM PATH™ Millionaires™ — Middle Class to Millionaire Lifestyle Scorecard™ — Dimension 02"
    >

    <title>
        CTM PATH™ MILLIONAIRES™ — Dimension 02
    </title>


    <!-- =====================================================================
         GLOBAL FOUNDATION
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/foundation/tokens.css"
    >

    <link
        rel="stylesheet"
        href="../css/foundation/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/foundation/responsive.css"
    >


    <!-- =====================================================================
         GLOBAL COMPONENTS
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/header.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >


    <!-- =====================================================================
         PAGE 02 SHARED DIMENSION SYSTEM
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02-shared.css"
    >


    <!-- =====================================================================
         PAGE 02C
    ====================================================================== -->

    <link
        rel="stylesheet"
        href="../css/page02/page02c.css"
    >

</head>


<body>


<!-- =========================================================================
     GLOBAL HEADER
============================================================================ -->


<div
    id="global-header"
    data-component="header"
></div>



<!-- =========================================================================
     PAGE 02C
     DIMENSION 02
============================================================================ -->


<main
    id="page02c"
    class="page02-dimension page02c"
>


    <div class="page02-dimension-shell">


        <!-- =================================================================
             JOURNEY PROGRESS
        ================================================================== -->


        <div
            class="dimension-progress"
            aria-label="Scorecard journey progress"
        >


            <div class="dimension-progress-meta">


                <p class="dimension-progress-label">

                    MILLIONAIRE LIFESTYLE SCORECARD™

                </p>


                <p
                    id="dimensionProgressNumber"
                    class="dimension-progress-number"
                >

                    2 / 5

                </p>


            </div>


            <div class="dimension-progress-track">


                <span
                    id="dimensionProgressFill"
                    class="dimension-progress-fill"
                    role="progressbar"
                    aria-label="Dimension progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="40"
                ></span>


            </div>


        </div>



        <!-- =================================================================
             DIMENSION HEADER
        ================================================================== -->


        <header class="dimension-header">


            <p class="dimension-eyebrow">

                DIMENSION 02

            </p>


            <!--
                Dimension title is populated from page02-data.js
                through page02-scorecard.js.
            -->


            <h1
                id="dimensionTitleTamil"
                class="dimension-title-tamil"
            ></h1>


            <p
                id="dimensionTitleEnglish"
                class="dimension-title-english"
            ></p>


            <p class="dimension-introduction">

                உங்கள் தற்போதைய வாழ்க்கை நிலைக்கு
                மிகவும் பொருத்தமான ஒரு தேர்வை
                ஒவ்வொரு அளவுகோலிலும் தேர்ந்தெடுக்கவும்.

            </p>



            <!-- =============================================================
                 LIVE DIMENSION SCORE
            ============================================================== -->


            <div
                class="dimension-score-panel"
                aria-live="polite"
            >


                <span class="dimension-score-label">

                    YOUR DIMENSION SCORE

                </span>


                <span class="dimension-score-value">


                    <span
                        id="dimensionScoreCurrent"
                        class="dimension-score-current"
                    >

                        0

                    </span>


                    <span
                        id="dimensionScoreTotal"
                        class="dimension-score-total"
                    >

                        / 20

                    </span>


                </span>


            </div>


        </header>



        <!-- =================================================================
             SCORECARD

             No question or option data is duplicated here.

             page02-scorecard.js reads Dimension 02 from page02-data.js
             and renders Indicators 06–10.
        ================================================================== -->


        <section
            class="dimension-scorecard"
            aria-label="Dimension 02 scorecard"
        >


            <div
                id="scorecardList"
                class="scorecard-list"
            ></div>


        </section>



        <!-- =================================================================
             ANSWER PROGRESS
        ================================================================== -->


        <div
            class="dimension-completion"
            aria-live="polite"
        >


            <p>

                <span data-dimension-answered>
                    0
                </span>

                /

                <span data-dimension-total>
                    5
                </span>

                INDICATORS COMPLETED

            </p>


        </div>



        <!-- =================================================================
             HOW YOUR SCORE WORKS

             Rendered by page02-scorecard.js.
             Same four-level visual architecture as the answer options.
        ================================================================== -->


        <aside
            id="scoreGuide"
            class="score-guide"
            aria-label="How your score works"
        ></aside>



        <!-- =================================================================
             VALIDATION MESSAGE
        ================================================================== -->


        <div
            id="dimensionMessage"
            class="dimension-message"
            role="alert"
            aria-live="assertive"
            hidden
        ></div>



        <!-- =================================================================
             NAVIGATION
        ================================================================== -->


        <nav
            class="dimension-navigation"
            aria-label="Scorecard navigation"
        >


            <!-- =============================================================
                 PREVIOUS
            ============================================================== -->


            <button
                id="previousButton"
                class="
                    dimension-button
                    dimension-button-secondary
                "
                type="button"
            >


                <span class="dimension-button-primary-text">

                    ← முந்தைய பரிமாணம்

                </span>


                <span class="dimension-button-secondary-text">

                    BACK TO DIMENSION 01

                </span>


            </button>



            <!-- =============================================================
                 NEXT

                 page02c.js validates Indicators 06–10 before allowing
                 navigation to Page 02D.
            ============================================================== -->


            <button
                id="nextButton"
                class="
                    dimension-button
                    dimension-button-primary
                "
                type="button"
            >


                <span class="dimension-button-primary-text">

                    அடுத்த பரிமாணம் →

                </span>


                <span class="dimension-button-secondary-text">

                    CONTINUE TO DIMENSION 03

                </span>


            </button>


        </nav>


    </div>


</main>



<!-- =========================================================================
     GLOBAL FOOTER
============================================================================ -->


<div
    id="global-footer"
    data-component="footer"
></div>



<!-- =========================================================================
     GLOBAL JAVASCRIPT
============================================================================ -->


<script src="../js/component-loader.js"></script>

<script src="../js/global.js"></script>

<script src="../js/api.js"></script>



<!-- =========================================================================
     PAGE 02 JAVASCRIPT

     LOAD ORDER IS CRITICAL:

     1. page02-data.js
        Frozen 25 indicators + 100 ranges

     2. page02-session.js
        Shared journey state

     3. page02-scorecard.js
        Shared rendering + scoring + validation

     4. page02c.js
        Dimension 02 navigation controller
============================================================================ -->


<script src="../js/page02/page02-data.js"></script>

<script src="../js/page02/page02-session.js"></script>

<script src="../js/page02/page02-scorecard.js"></script>

<script src="../js/page02/page02c.js"></script>


</body>

</html>
