
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ======================================================
         CTM PATH™ Guided Journey™
         Foundation v1.0
         ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CTM PATH™ Guided Journey™ — Every Dream Has A Path™">

    <meta
        name="theme-color"
        content="#0F172A">

    <meta
        name="color-scheme"
        content="dark">

    <title>

        CTM PATH™ Guided Journey™

    </title>

    <!-- ======================================================
         Stylesheets
         ====================================================== -->

    <link
        rel="stylesheet"
        href="css/foundation.css">

    <link
        rel="stylesheet"
        href="css/theme.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

</head>

<body>

    <!-- ======================================================
         Global Loader
         ====================================================== -->

    <div
        id="loader-container"
        aria-hidden="true">
    </div>

    <!-- ======================================================
         Global Modal
         ====================================================== -->

    <div
        id="modal-container"
        aria-hidden="true">
    </div>

    <!-- ======================================================
         Global Toast
         ====================================================== -->

    <div
        id="toast-container"
        aria-live="polite"
        aria-atomic="true">
    </div>

    <!-- ======================================================
         Permanent Application Shell
         ====================================================== -->

    <div id="application-shell">

        <header
            id="header-container"
            role="banner">
        </header>

        <section
            id="progress-container"
            aria-label="Journey Progress">
        </section>

        <main
            id="app"
            role="main"
            tabindex="-1">
        </main>

        <footer
            id="footer-container"
            role="contentinfo">
        </footer>

    </div>

    <!-- ======================================================
         JavaScript
         Load Order MUST NEVER change.
         ====================================================== -->

    <script src="js/config.js"></script>

    <script src="js/logger.js"></script>

    <script src="js/events.js"></script>

    <script src="js/state.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/validation.js"></script>

    <script src="js/api.js"></script>

    <script src="js/services.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/router.js"></script>

    <script src="js/navigation.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
