
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ======================================================
         CTM PATH™ Guided Journey™
         Working MVP Shell v1.0
         ====================================================== -->


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <meta
        name="description"
        content="CTM PATH™ Guided Journey™ — Every Dream Has A Path™">


    <meta
        name="theme-color"
        content="#0F172A">


    <meta
        name="color-scheme"
        content="dark">


    <title>
        CTM PATH™ Guided Journey™
    </title>



    <!-- ======================================================
         CORE STYLES
         ====================================================== -->


    <link
        rel="stylesheet"
        href="css/foundation.css">


    <link
        rel="stylesheet"
        href="css/theme.css">


    <link
        rel="stylesheet"
        href="css/responsive.css">



</head>


<body>


    <!-- ======================================================
         APPLICATION SHELL
         ====================================================== -->


    <div id="application-shell">


        <!-- HEADER COMPONENT -->

        <header
            id="header-container"
            role="banner">
        </header>



        <!-- JOURNEY PROGRESS -->

        <section
            id="progress-container"
            aria-label="Journey Progress">
        </section>



        <!-- PAGE CONTENT -->

        <main
            id="app"
            role="main"
            tabindex="-1">
        </main>



        <!-- FOOTER COMPONENT -->

        <footer
            id="footer-container"
            role="contentinfo">
        </footer>



    </div>




    <!-- ======================================================
         MVP JAVASCRIPT LOAD ORDER
         ====================================================== -->


    <!-- Configuration -->

    <script src="js/config.js"></script>



    <!-- API / Backend Connection -->

    <script src="js/api.js"></script>



    <!-- Shared Components -->

    <script src="js/component-loader.js"></script>



    <!-- Simple Page Navigation -->

    <script src="js/navigation.js"></script>



    <!-- Application Controller -->

    <script src="js/app.js"></script>



</body>

</html>
