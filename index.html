
<!-- ==========================================================================
   CTM PATH™ Guided Journey™

   File        : index.html
   Version     : 1.0
   Status      : DEVELOPMENT
   Stage       : STAGE 0 — FOUNDATION

   Purpose     :
   Application entry point for the CTM PATH™ Guided Journey™
   frontend application.

   Responsibilities:

   • Initialize the frontend application shell.
   • Load global stylesheets.
   • Provide root containers for dynamic page rendering.
   • Load frontend modules in controlled sequence.
   • Maintain separation between presentation layer and backend services.

   Architecture:

   Frontend:
   • HTML presentation layer
   • CSS styling system
   • Vanilla JavaScript controllers

   Backend:
   • Google Apps Script API
   • Google Sheets database
   • Assessment engine
   • Scoring engine
   • Diagnosis engine
   • Report generation

   IMPORTANT:
   This file contains NO business logic.
   All calculations, persistence and workflow decisions belong
   exclusively to the backend.

   ========================================================================== -->


<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ----------------------------------------------------------------------
         Document Metadata
    ----------------------------------------------------------------------- -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="CTM PATH™ Guided Journey™ — A transformational life assessment experience.">

    <meta name="application-name"
          content="CTM PATH™ Guided Journey™">

    <title>
        CTM PATH™ Guided Journey™
    </title>


    <!-- ----------------------------------------------------------------------
         Foundation Styles
    ----------------------------------------------------------------------- -->

    <link rel="stylesheet"
          href="css/foundation.css">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/responsive.css">


</head>


<body>


<!-- ==========================================================================
     APPLICATION SHELL
     ========================================================================== -->


<div id="app-shell"
     class="app-shell">


    <!-- ----------------------------------------------------------------------
         Global Loading Layer

         Controlled by:
         js/app.js

         Purpose:
         Provides consistent loading experience while:
         • Initializing application
         • Loading page modules
         • Communicating with backend API

    ----------------------------------------------------------------------- -->

    <div id="global-loader"
         class="global-loader hidden">


        <div class="loader-container">


            <div class="loader-spinner"
                 aria-label="Loading">
            </div>


            <p class="loader-message">
                Preparing your journey...
            </p>


        </div>


    </div>



    <!-- ----------------------------------------------------------------------
         Header Component Mount Point

         Component:
         /components/header.html

         Loaded dynamically.

    ----------------------------------------------------------------------- -->

    <header id="app-header"
            class="app-header">

    </header>



    <!-- ----------------------------------------------------------------------
         Main Application Container

         All 18 journey pages render inside this container.

         Journey:

         Page 01  Welcome
         Page 02  Registration
         Page 03  Assessment 01
         ...
         Page 15  KALA CHAKRA™
         Page 16  Diagnosis
         Page 17  Prescription
         Page 18  CTA

    ----------------------------------------------------------------------- -->

    <main id="app-content"
          class="app-content"
          role="main">


    </main>



    <!-- ----------------------------------------------------------------------
         Navigation Component Mount Point

         Component:
         /components/navigation.html

         Controlled by:
         js/navigation.js

    ----------------------------------------------------------------------- -->

    <nav id="app-navigation"
         class="app-navigation">

    </nav>



    <!-- ----------------------------------------------------------------------
         Footer Component Mount Point

         Component:
         /components/footer.html

    ----------------------------------------------------------------------- -->

    <footer id="app-footer"
            class="app-footer">

    </footer>


</div>



<!-- ==========================================================================
     APPLICATION ERROR CONTAINER

     Used for controlled frontend errors.

     No technical details displayed to users.

     Controlled by:
     js/app.js

     ========================================================================== -->

<div id="error-container"
     class="error-container hidden">


</div>



<!-- ==========================================================================
     JAVASCRIPT FOUNDATION LOAD ORDER

     IMPORTANT:

     Files are loaded in dependency sequence.

     Stage 0 Foundation:

     1. app.js
     2. api.js
     3. storage.js
     4. navigation.js
     5. assessmentEngine.js
     6. scoring.js
     7. report.js

     Page controllers are loaded only when required.

     ========================================================================== -->


<script src="js/app.js"></script>

<script src="js/api.js"></script>

<script src="js/storage.js"></script>

<script src="js/navigation.js"></script>

<script src="js/assessmentEngine.js"></script>

<script src="js/scoring.js"></script>

<script src="js/report.js"></script>


</body>

</html>
